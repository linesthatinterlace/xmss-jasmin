name: Weekly Deep Tests

on:
  schedule:
    - cron: '0 4 * * 0'  # Weekly: Sunday 04:00 UTC
  workflow_dispatch:       # Manual trigger

jobs:
  # C: full exhaustive BDS matrix (H=5 and H=10, all K values)
  # This catches treehash budget bugs across every (H,K) combination.
  c-exhaustive:
    name: C exhaustive BDS
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    defaults:
      run:
        working-directory: impl/c
    steps:
      - uses: actions/checkout@v4

      - name: Configure (debug — enables assertions)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXMSS_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Exhaustive BDS test (H=5 K=0,2,4 + H=10 K=0,2,4)
        run: ctest --test-dir build --output-on-failure -R test_bds_exhaustive
        timeout-minutes: 30

  # Jasmin: deep interop (64 sigs with BDS state comparison) +
  # slow API tests (h=16, h=20) + full boundary verification
  jasmin-deep:
    name: Jasmin deep
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl/jasmin
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14"

      - name: Install Jasmin
        run: opam install jasmin -y

      - name: Build C library
        working-directory: impl/c
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target xmss

      - name: Compile
        run: opam exec -- make -j$(nproc)

      - name: Deep interop (64 sigs + BDS state comparison)
        run: ./build/test/test_interop_deep_xmss_sha2_10_256

      - name: Slow API tests (h=16, h=20)
        run: |
          ./build/test/test_api_xmss_sha2_16_256
          ./build/test/test_api_xmss_sha2_20_256
        timeout-minutes: 15

      - name: Boundary tests (verify every signature)
        run: |
          ./build/test/test_api_xmssmt_sha2_20_2_256
          ./build/test/test_api_xmssmt_sha2_20_4_256
        timeout-minutes: 30
