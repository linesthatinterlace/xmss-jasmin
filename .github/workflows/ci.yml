name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.cc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    defaults:
      run:
        working-directory: impl/c
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DXMSS_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Fast tests (Tier 1)
        run: ctest --test-dir build --output-on-failure -L fast

      - name: Core tests (Tier 2)
        run: ctest --test-dir build --output-on-failure -L core

      - name: Deep tests (Tier 3)
        run: ctest --test-dir build --output-on-failure -L deep

  # Jasmin: build + CT checks (needs jasminc/jasmin-ct)
  jasmin-build:
    name: jasmin-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl/jasmin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@e32b06a3e831ff2fbc6f08cf35be2085e3918014 # v3
        with:
          ocaml-compiler: "4.14"

      - name: Install Jasmin
        run: opam install jasmin -y

      - name: Build C library
        working-directory: impl/c
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target xmss

      - name: Compile Jasmin
        run: opam exec -- make -j$(nproc)

      - name: CT checks
        run: opam exec -- make ct

      - name: Upload test binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jasmin-test-binaries
          path: impl/jasmin/build/test/
          retention-days: 1

  # Parallel test jobs — no OCaml needed, just run the pre-built binaries
  jasmin-unit:
    name: jasmin-unit
    needs: jasmin-build
    runs-on: ubuntu-latest
    steps:
      - name: Download test binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jasmin-test-binaries
          path: bin

      - name: Unit tests (9 tests)
        run: |
          chmod +x bin/*
          bin/test_address
          bin/test_utils
          bin/test_sha256
          bin/test_wots
          bin/test_ltree
          bin/test_treehash
          bin/test_bds
          bin/test_xmss
          bin/test_xmssmt

  jasmin-api:
    name: jasmin-api
    needs: jasmin-build
    runs-on: ubuntu-latest
    steps:
      - name: Download test binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jasmin-test-binaries
          path: bin

      - name: API tests (h=10, MT 20/2, MT 20/4)
        run: |
          chmod +x bin/*
          bin/test_api_xmss_sha2_10_256
          bin/test_api_xmssmt_sha2_20_2_256
          bin/test_api_xmssmt_sha2_20_4_256

  jasmin-interop:
    name: jasmin-interop
    needs: jasmin-build
    runs-on: ubuntu-latest
    steps:
      - name: Download test binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jasmin-test-binaries
          path: bin

      - name: Interop tests (shallow)
        run: |
          chmod +x bin/*
          bin/test_interop_xmss_sha2_10_256
          bin/test_interop_xmssmt_sha2_20_2_256

      - name: Deep interop (64 sigs + BDS state comparison)
        run: bin/test_interop_deep_xmss_sha2_10_256

      - name: KAT tests
        run: |
          bin/test_kat_xmss_sha2_10_256
          bin/test_kat_xmssmt_sha2_20_2_256
